services:
  sale-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sale-monitor
    restart: unless-stopped
    labels:
      - "net.unraid.docker.webui=http://[IP]:[PORT:5050]"
      - "net.unraid.docker.icon=http://[IP]:[PORT:5050]/static/img/icon.png"
    env_file:
      - .env
    environment:
      # General
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-30m}
      - HISTORY_RETENTION_DAYS=${HISTORY_RETENTION_DAYS:-90}
      # Email notifications
      - ENABLE_EMAIL_NOTIFICATIONS=${ENABLE_EMAIL_NOTIFICATIONS:-true}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - RECIPIENT_EMAIL=${RECIPIENT_EMAIL}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      # Web runtime
      - PRODUCTS_CSV=/app/data/products.csv
      - STATE_FILE=/app/data/state.json
      - HISTORY_DB=/app/data/history.db
      - FLASK_DEBUG=0
      - USER_AGENT=${USER_AGENT:-Mozilla/5.0 (compatible; SaleMonitor/1.0)}
      - TIMEOUT=${TIMEOUT:-30}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      # Product Discovery (disabled by default - can be slow)
      - ENABLE_AUTO_DISCOVERY=${ENABLE_AUTO_DISCOVERY:-0}
      - DISCOVERY_INTERVAL_HOURS=${DISCOVERY_INTERVAL_HOURS:-24}
    ports:
      - "5050:5000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5000/ > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3