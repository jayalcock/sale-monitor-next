{% extends 'base.html' %}
{% block title %}Compare{% endblock %}
{% block content %}
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex items-center mb-6">
      <h2 class="text-2xl font-semibold text-white mr-4">Competitive Comparison</h2>
      <button class="bg-primary-600 hover:bg-primary-500 text-white text-sm px-3 py-1 rounded" id="refreshBtn">Refresh</button>
      <a class="ml-2 text-sm px-3 py-1 rounded border border-gray-600 text-gray-200 hover:bg-gray-700" href="/manage">Manage Products</a>
    </div>

    <div id="groupsContainer">
      <div id="groups-loading" class="space-y-4">
        <div class="skeleton-card"><div class="flex items-center gap-3 mb-3"><div class="skeleton skeleton-heading" style="width:40%"></div></div><div class="skeleton skeleton-text" style="width:70%"></div><div class="skeleton skeleton-text" style="width:55%"></div></div>
        <div class="skeleton-card"><div class="flex items-center gap-3 mb-3"><div class="skeleton skeleton-heading" style="width:35%"></div></div><div class="skeleton skeleton-text" style="width:65%"></div><div class="skeleton skeleton-text" style="width:50%"></div></div>
      </div>
    </div>

    <div id="suggestionsSection" class="mt-8 hidden">
      <h3 class="text-lg font-semibold text-white mb-2">Suggested Links</h3>
      <p class="text-gray-400 text-xs mb-3">Products with similar names that aren't in a group yet.</p>
      <div id="suggestionsContainer" class="text-sm text-gray-200"></div>
    </div>
  </div>

  <script>
  function hideGroupsLoader() {
    const loader = document.getElementById('groups-loading');
    if (loader) loader.remove();
  }

  function getMerchant(url) {
    try {
      const host = new URL(url).hostname.replace(/^www\./, '');
      return host;
    } catch { return url; }
  }

  function groupDisplayName(g) {
    // Use the first item's name as the group label instead of the hash
    if (g.items && g.items.length > 0) return g.items[0].name;
    return g.group_key;
  }

  async function fetchGroups() {
    try {
      const res = await fetch('/api/compare/groups');
      if (!res.ok) {
        hideGroupsLoader();
        showError('Server error: ' + (await res.text()).slice(0,200));
        return;
      }
      const data = await res.json();
      const groups = Array.isArray(data) ? data : (data.items || []);
      renderGroups(groups);
      fetchSuggestions();
    } catch (e) {
      hideGroupsLoader();
      showError('Fetch failed: ' + e);
    }
  }

  function renderGroups(groups) {
    const container = document.getElementById('groupsContainer');
    hideGroupsLoader();
    if (!Array.isArray(groups) || groups.length === 0) {
      container.innerHTML = `
        <div class="text-center py-12">
          <svg class="mx-auto h-16 w-16 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm0 7a1 1 0 011-1h10a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1v-2zm0 7a1 1 0 011-1h7a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1v-2z"></path>
          </svg>
          <h3 class="mt-3 text-lg font-medium text-gray-300">No Competitor Groups Yet</h3>
          <p class="mt-2 text-sm text-gray-400 max-w-md mx-auto">Groups are formed from product identifiers (MPN/SKU/GTIN) or manual links. Add products with matching identifiers to see competitive comparisons.</p>
          <div class="mt-5">
            <a href="/manage" class="inline-flex items-center px-4 py-2 rounded-md text-sm font-medium bg-primary-600 hover:bg-primary-700 text-white">Add Products</a>
          </div>
        </div>`;
      return;
    }

    container.innerHTML = groups.map(g => {
      const lowestBase = g.items[0]?.price_in_base;
      const hasBasePrices = g.items.filter(it => it.price_in_base != null).length >= 2;

      const items = g.items.map((it, idx) => {
        const merchant = getMerchant(it.url);
        const isLowest = idx === 0 && hasBasePrices;

        // Price difference vs lowest
        let diffHtml = '';
        if (hasBasePrices && idx > 0 && it.price_in_base != null && lowestBase != null) {
          const diff = it.price_in_base - lowestBase;
          if (diff > 0) {
            diffHtml = `<span class="text-red-400 text-xs ml-2">+$${diff.toFixed(2)} more</span>`;
          }
        } else if (isLowest && hasBasePrices) {
          diffHtml = `<span class="text-green-400 text-xs ml-2">Best price</span>`;
        }

        const checkedAgo = it.last_checked ? timeAgo(it.last_checked) : '';

        return `
          <div class="flex items-center justify-between px-4 py-3 border-b border-gray-700 ${isLowest ? 'bg-green-900/20 border-l-2 border-l-green-500' : 'bg-gray-800'}">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <span class="text-gray-400 text-xs font-mono">${merchant}</span>
                ${diffHtml}
              </div>
              <div class="mt-1">
                <a class="text-primary-300 hover:text-primary-200 font-medium text-sm" href="${it.url}" target="_blank" rel="noopener">${it.name}</a>
              </div>
              <div class="text-xs text-gray-400 mt-1">
                ${it.currency} $${formatPrice(it.current_price)}
                ${it.price_in_base != null ? ` <span class="text-gray-500">|</span> Base: $${formatPrice(it.price_in_base)}` : ''}
                ${checkedAgo ? ` <span class="text-gray-500">|</span> ${checkedAgo}` : ''}
              </div>
            </div>
            <button class="text-gray-500 hover:text-red-400 ml-3 p-1" title="Remove from group" onclick="unlinkProduct('${encodeURIComponent(it.url)}')">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
          </div>`;
      }).join('');

      // Savings summary
      let savingsHtml = '';
      if (hasBasePrices && g.items.length >= 2) {
        const highest = g.items[g.items.length - 1].price_in_base;
        if (highest != null && lowestBase != null && highest > lowestBase) {
          const pct = ((highest - lowestBase) / highest * 100).toFixed(0);
          savingsHtml = `<span class="text-green-400 text-xs ml-3">Save up to $${(highest - lowestBase).toFixed(2)} (${pct}%)</span>`;
        }
      }

      const id = g.identifiers || {};
      const idParts = ['brand','sku','mpn','gtin']
        .filter(k => id[k])
        .map(k => `<span class="text-gray-500">${k.toUpperCase()}:</span> ${id[k]}`)
        .join(' <span class="text-gray-600 mx-1">|</span> ');

      return `
        <div class="mb-5 rounded-lg border border-gray-700 overflow-hidden">
          <div class="px-4 py-3 bg-gray-900 border-b border-gray-700">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="font-semibold text-white">${groupDisplayName(g)}</span>
                <span class="text-xs text-gray-500">${g.items.length} vendors</span>
                ${savingsHtml}
              </div>
            </div>
            ${idParts ? `<div class="text-xs text-gray-400 mt-1">${idParts}</div>` : ''}
          </div>
          ${items}
        </div>`;
    }).join('');
  }

  function timeAgo(iso) {
    try {
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      return Math.floor(hrs / 24) + 'd ago';
    } catch { return ''; }
  }

  document.getElementById('refreshBtn').addEventListener('click', fetchGroups);
  fetchGroups();

  async function fetchSuggestions() {
    try {
      const res = await fetch('/api/compare/suggest');
      if (!res.ok) return;
      const data = await res.json();
      const sugg = Array.isArray(data) ? data : (data.items || []);
      const section = document.getElementById('suggestionsSection');
      const box = document.getElementById('suggestionsContainer');
      if (!Array.isArray(sugg) || sugg.length === 0) {
        section.classList.add('hidden');
        return;
      }
      section.classList.remove('hidden');
      box.innerHTML = sugg.slice(0, 10).map(s => {
        const merchantA = getMerchant(s.urlA);
        const merchantB = getMerchant(s.urlB);
        return `
        <div class="flex items-center justify-between border-b border-gray-700 py-3">
          <div class="flex-1 min-w-0 mr-3">
            <div class="flex items-center gap-2">
              <a class="text-primary-300 hover:text-primary-200 text-sm truncate" href="${s.urlA}" target="_blank">${s.nameA}</a>
              <span class="text-gray-500 text-xs">${merchantA}</span>
            </div>
            <div class="flex items-center gap-2 mt-1">
              <a class="text-primary-300 hover:text-primary-200 text-sm truncate" href="${s.urlB}" target="_blank">${s.nameB}</a>
              <span class="text-gray-500 text-xs">${merchantB}</span>
            </div>
          </div>
          <button class="text-xs px-3 py-1.5 rounded bg-primary-600 hover:bg-primary-500 text-white whitespace-nowrap" onclick="linkPair('${s.urlA}', '${s.urlB}')">Link</button>
        </div>`;
      }).join('');
    } catch {}
  }

  async function linkPair(urlA, urlB) {
    try {
      const res = await fetch('/api/compare/link', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({urlA, urlB})
      });
      if (!res.ok) throw new Error(await res.text());
      fetchGroups();
    } catch (e) {
      showError('Link failed: ' + e);
    }
  }

  async function unlinkProduct(encodedUrl) {
    const url = decodeURIComponent(encodedUrl);
    try {
      const res = await fetch('/api/compare/unlink', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url})
      });
      if (!res.ok) throw new Error(await res.text());
      fetchGroups();
    } catch (e) {
      showError('Unlink failed: ' + e);
    }
  }
  </script>
{% endblock %}
