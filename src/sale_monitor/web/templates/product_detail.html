{% extends "base.html" %}

{% block title %}Product Details - Sale Monitor{% endblock %}

<!-- v2.0 - price_in_base only, no price_cad fallback -->
{% block content %}
<div class="row mb-3">
    <div class="col-12 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <a href="/" class="btn btn-secondary">&larr; Back to Dashboard</a>
        <div class="d-flex align-items-center gap-2">
            <button id="update-price-btn" class="btn btn-primary" title="Check price now">
                🔄 Update Price
            </button>
            <div id="nav-buttons" style="display: none;">
                <button id="prev-btn" class="btn btn-outline-primary" title="Previous product">
                    &larr; Previous
                </button>
                <span id="product-position" class="mx-2 text-muted"></span>
                <button id="next-btn" class="btn btn-outline-primary" title="Next product">
                    Next &rarr;
                </button>
            </div>
        </div>
    </div>
</div>

<div id="loading" class="text-center my-5">
    <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<div id="product-detail" style="display: none;">
    <div class="row mb-4">
        <div class="col-12">
            <h1 id="product-name">Product Details</h1>
        </div>
    </div>
    
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Current Status</h5>
                    <div class="mb-3 text-center" id="product-image-wrapper" style="min-height: 160px;">
                        <img id="product-image" alt="Product image" class="img-fluid rounded shadow-sm" style="max-height: 220px; object-fit: contain; display: none;">
                        <div id="product-image-fallback" class="text-muted" style="display: none;">No image available</div>
                    </div>
                    <div id="current-status">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Statistics (Last 30 Days)</h5>
                    <div id="stats-content">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="card-title mb-0">Price History</h5>
                        <select id="currency-toggle" class="form-select form-select-sm" style="width: 190px;" title="Choose display currency">
                            <option value="base" selected>Currency: Base (CAD)</option>
                            <option value="native">Currency: Native</option>
                        </select>
                    </div>
                    <div class="chart-responsive-wrapper mt-2">
                        <canvas id="price-chart"></canvas>
                    </div>
<style>
.chart-responsive-wrapper {
    width: 100%;
    max-width: 100vw;
    min-height: 220px;
    height: 400px;
    position: relative;
}
@media (max-width: 576px) {
    .chart-responsive-wrapper {
        height: 220px;
        min-height: 160px;
    }
    #price-chart {
        max-height: 220px !important;
    }
}
</style>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="error-alert" class="alert alert-danger" role="alert" style="display: none;">
    <strong>Error:</strong> <span id="error-message"></span>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
let chart = null;
let refreshInterval;
let CURRENT_BASE_CURRENCY = 'CAD';
let allProducts = [];
let currentProductIndex = -1;
let RESOLVED_URL = null; // canonical URL found in products.csv

function parseUtcIso(dateStr) {
    if (!dateStr) return null;
    const hasTz = /[zZ]|[\+\-]\d{2}:?\d{2}$/.test(dateStr);
    const s = hasTz ? dateStr : `${dateStr}Z`;
    const d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
}

// Simple currency formatter for stats values
function formatPrice(value) {
    if (value === null || value === undefined || isNaN(Number(value))) return 'N/A';
    return `$${Number(value).toFixed(2)}`;
}

function getUrlParameter(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

// Normalize URLs for robust matching: lowercase host, drop www, strip trailing slash,
// and remove common tracking params (keep functional params like 'variant').
function normalizeUrl(u) {
    if (!u || typeof u !== 'string') return '';
    try {
        // Decode once if needed (avoid double-decoding exceptions)
        try { u = decodeURIComponent(u); } catch (_) {}
        const url = new URL(u);
        // Lowercase protocol/host, drop www.
        url.protocol = url.protocol.toLowerCase();
        url.hostname = url.hostname.replace(/^www\./i, '').toLowerCase();
        // Strip trailing slash from path (except root)
        if (url.pathname.length > 1 && url.pathname.endsWith('/')) {
            url.pathname = url.pathname.replace(/\/+$/, '');
        }
        // Remove known tracking params only
        const tracking = new Set(['gclid','fbclid','msclkid','utm_source','utm_medium','utm_campaign','utm_term','utm_content','_branch_match_id','sca_ref','ref','ref_']);
        for (const key of Array.from(url.searchParams.keys())) {
            if (tracking.has(key.toLowerCase()) || key.toLowerCase().startsWith('utm_')) {
                url.searchParams.delete(key);
            }
        }
        // Sort remaining params for stability
        const entries = Array.from(url.searchParams.entries()).sort((a,b)=> a[0].localeCompare(b[0]) || String(a[1]).localeCompare(String(b[1])));
        url.search = '';
        for (const [k,v] of entries) url.searchParams.append(k,v);
        // Reconstruct normalized string (omit default ports)
        const port = url.port ? `:${url.port}` : '';
        const search = url.search ? `?${url.searchParams.toString()}` : '';
        return `${url.protocol}//${url.hostname}${port}${url.pathname}${search}`;
    } catch (_) {
        // Fallback: lightweight normalization
        return String(u).replace(/^https?:\/\//i,'').replace(/^www\./i,'').replace(/\/+$/,'').toLowerCase();
    }
}

// Resolve the provided URL against /api/products by normalized comparison.
function resolveProductUrl(rawUrl) {
    return fetch(`/api/products`)
        .then(r => r.ok ? r.json() : Promise.reject(new Error('Failed to fetch product list')))
        .then(products => {
            // Save for navigation if not already loaded
            allProducts = Array.isArray(allProducts) && allProducts.length ? allProducts : products;
            const rawNorm = normalizeUrl(rawUrl);
            // 1) Exact match
            let found = products.find(p => p.url === rawUrl);
            if (found) return found.url;
            // 2) Normalized match (host/path/tracking-insensitive)
            found = products.find(p => normalizeUrl(p.url) === rawNorm);
            if (found) return found.url;
            // 3) Ignore query string entirely as last resort
            try {
                const ru = new URL(rawUrl);
                const noQuery = `${ru.origin}${ru.pathname}`;
                found = products.find(p => {
                    try { return new URL(p.url).origin + new URL(p.url).pathname === noQuery; } catch { return false; }
                });
                if (found) return found.url;
            } catch {}
            // Not found; return raw (caller will show error)
            return rawUrl;
        });
}

function setupNavigation() {
    const navButtons = document.getElementById('nav-buttons');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const positionSpan = document.getElementById('product-position');
    
    if (allProducts.length <= 1) {
        navButtons.style.display = 'none';
        return;
    }
    
    navButtons.style.display = 'inline-block';
    
    // Update position display
    positionSpan.textContent = `${currentProductIndex + 1} / ${allProducts.length}`;
    
    // Enable/disable buttons based on position
    prevBtn.disabled = currentProductIndex <= 0;
    nextBtn.disabled = currentProductIndex >= allProducts.length - 1;
    
    // Setup click handlers
    prevBtn.onclick = () => {
        if (currentProductIndex > 0) {
            const prevProduct = allProducts[currentProductIndex - 1];
            window.location.href = `/product/detail?url=${encodeURIComponent(prevProduct.url)}`;
        }
    };
    
    nextBtn.onclick = () => {
        if (currentProductIndex < allProducts.length - 1) {
            const nextProduct = allProducts[currentProductIndex + 1];
            window.location.href = `/product/detail?url=${encodeURIComponent(nextProduct.url)}`;
        }
    };
}

function formatPriceDetailed(product) {
    const price = product.current_price;
    const currency = product.currency || 'CAD';
    const baseCurrency = product.base_currency || 'CAD';
    const priceInBase = product.price_in_base;
    const currencySource = (product.currency_source || '').toLowerCase();
    
    if (price === null || price === undefined) return 'N/A';
    
    const base = `$${parseFloat(price).toFixed(2)} ${currency}`;
    if (currency !== baseCurrency && priceInBase != null) {
        const approx = ` (~$${parseFloat(priceInBase).toFixed(2)} ${baseCurrency})`;
        const badge = (currencySource && currencySource !== 'detected')
            ? ` <span class="badge rounded-pill bg-warning text-dark" title="Currency not detected from page; ${currencySource} value used">⚠︎</span>`
            : '';
        return `${base}${approx}${badge}`;
    }
    const badge = (currencySource && currencySource !== 'detected')
        ? ` <span class="badge rounded-pill bg-warning text-dark" title="Currency not detected from page; ${currencySource} value used">⚠︎</span>`
        : '';
    return `$${parseFloat(price).toFixed(2)} ${currency}${badge}`;
}

function formatDate(dateStr) {
    const date = parseUtcIso(dateStr);
    if (!date) return 'Never';
    return date.toLocaleString();
}

function loadProductInfo(url) {
    fetch(`/api/products`)
        .then(response => {
            if (!response.ok) throw new Error('Failed to fetch product info');
            return response.json();
        })
        .then(products => {
            allProducts = products;
            const product = products.find(p => p.url === url);
            if (!product) throw new Error('Product not found');
            
            // Find current product index and setup navigation
            currentProductIndex = products.findIndex(p => p.url === url);
            setupNavigation();
            
            // Capture base currency
            if (product.base_currency) {
                CURRENT_BASE_CURRENCY = product.base_currency;
                // Update toggle label
                const baseOpt = document.querySelector('#currency-toggle option[value="base"]');
                if (baseOpt) baseOpt.textContent = `Currency: Base (${CURRENT_BASE_CURRENCY})`;
            }
            
            document.getElementById('product-name').textContent = product.name;
            // Try load product image
            // Use proxying file endpoint (resized & cached). Fallback to original URL endpoint if needed.
            const imgEl = document.getElementById('product-image');
            const fallbackEl = document.getElementById('product-image-fallback');
            const proxyUrl = `/api/product/image/file?url=${encodeURIComponent(product.url)}&w=600&h=220`;
            const originalMetaUrl = `/api/product/image?url=${encodeURIComponent(product.url)}`;

            function showFallback() {
                imgEl.style.display = 'none';
                fallbackEl.style.display = 'block';
            }
            fetch(proxyUrl)
                .then(r => {
                    if (r.ok && r.headers.get('Content-Type')?.startsWith('image/')) {
                        return r.blob();
                    }
                    throw new Error('proxy not image');
                })
                .then(blob => {
                    const objUrl = URL.createObjectURL(blob);
                    imgEl.onload = () => {
                        URL.revokeObjectURL(objUrl);
                    };
                    imgEl.onerror = showFallback;
                    imgEl.src = objUrl;
                    imgEl.style.display = 'inline-block';
                    fallbackEl.style.display = 'none';
                })
                .catch(() => {
                    // Fallback: get original image URL (no resize)
                    fetch(originalMetaUrl)
                        .then(r => r.ok ? r.json() : Promise.reject())
                        .then(data => {
                            if (data && data.image_url) {
                                imgEl.onerror = showFallback;
                                imgEl.src = data.image_url;
                                imgEl.style.display = 'inline-block';
                                fallbackEl.style.display = 'none';
                            } else {
                                showFallback();
                            }
                        })
                        .catch(showFallback);
                });
            
            // Determine selector display
            let selectorInfo = '';
            if (product.selector) {
                const selectorSource = product.selector_source || 'manual';
                const sourceBadge = selectorSource === 'auto' 
                    ? '<span class="badge bg-info">Auto-detected</span>' 
                    : selectorSource === 'manual'
                    ? '<span class="badge bg-primary">Manual</span>'
                    : '<span class="badge bg-warning">Bookmarklet</span>';
                selectorInfo = `<p><strong>Price Selector:</strong> <code>${product.selector}</code> ${sourceBadge}</p>`;
            } else {
                selectorInfo = '<p><strong>Price Selector:</strong> <span class="badge bg-info">Auto-detection</span></p>';
            }
            
            const statusHtml = `
                <p><strong>Current Price:</strong> ${formatPriceDetailed(product)}</p>
                <p><strong>Target Price:</strong> ${product.target_price != null ? '$' + parseFloat(product.target_price).toFixed(2) + ' ' + (product.currency || 'CAD') : 'N/A'}</p>
                <p><strong>Discount Threshold:</strong> ${product.discount_threshold}%</p>
                <p><strong>Last Checked:</strong> ${formatDate(product.last_checked)}</p>
                <p><strong>Status:</strong> <span class="badge ${product.enabled ? 'bg-success' : 'bg-secondary'}">${product.enabled ? 'Enabled' : 'Disabled'}</span></p>
                ${selectorInfo}
                <p><a href="${product.url}" target="_blank" class="btn btn-sm btn-primary">View Product Page</a></p>
            `;
            document.getElementById('current-status').innerHTML = statusHtml;
        });
}

function loadStats(url) {
    fetch(`/api/product/stats?url=${encodeURIComponent(url)}&days=30`)
        .then(response => {
            if (!response.ok) throw new Error('Failed to fetch stats');
            return response.json();
        })
        .then(stats => {
            // Handle empty stats object (no history for this product)
            if (!stats || Object.keys(stats).length === 0 || !stats.total_checks) {
                document.getElementById('stats-content').innerHTML = '<p class="text-muted">No statistics available</p>';
                return;
            }
            const statsHtml = `
                <p><strong>Checks:</strong> ${stats.total_checks}</p>
                <p><strong>Lowest:</strong> ${formatPrice(stats.min_price)}</p>
                <p><strong>Highest:</strong> ${formatPrice(stats.max_price)}</p>
                <p><strong>Average:</strong> ${formatPrice(stats.avg_price)}</p>
                <p><strong>First Check:</strong> ${formatDate(stats.first_check)}</p>
                <p><strong>Latest Check:</strong> ${formatDate(stats.latest_check)}</p>
            `;
            document.getElementById('stats-content').innerHTML = statsHtml;
        })
        .catch(error => {
            console.error('Stats error:', error);
            document.getElementById('stats-content').innerHTML = '<p class="text-muted">No statistics available</p>';
        });
}

function loadHistory(url) {
    const days = 30;
    const currencyMode = document.getElementById('currency-toggle')?.value || 'base';
    
    fetch(`/api/product/history?url=${encodeURIComponent(url)}&days=${days}`)
        .then(response => {
            if (!response.ok) throw new Error('Failed to fetch history');
            return response.json();
        })
        .then(history => {
            if (history.length === 0) {
                document.getElementById('price-chart').insertAdjacentHTML('beforebegin', 
                    '<p class="text-muted">No price history available yet.</p>');
                return;
            }

            // Group by LOCAL day and keep the LOWEST price per day
            const dayMap = {};
            history.forEach(h => {
                const d = parseUtcIso(h.timestamp);
                if (!d) return;
                
                // Convert to local date for grouping (YYYY-MM-DD in local timezone)
                const localDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                const key = `${localDate.getFullYear()}-${String(localDate.getMonth() + 1).padStart(2, '0')}-${String(localDate.getDate()).padStart(2, '0')}`;
                
                // Use price_in_base for Base mode, native price for Native mode
                const v = (currencyMode === 'base')
                    ? h.price_in_base
                    : h.price;
                
                if (v != null) {
                    // Keep the lowest price for each day
                    if (!(key in dayMap) || Number(v) < dayMap[key]) {
                        dayMap[key] = Number(v);
                    }
                }
            });

            // Build last N days array using LOCAL dates
            const daysArr = [];
            const dayKeys = [];
            for (let i = days - 1; i >= 0; i--) {
                const local = new Date();
                local.setHours(0,0,0,0);
                local.setDate(local.getDate() - i);
                daysArr.push(local);
                const key = `${local.getFullYear()}-${String(local.getMonth() + 1).padStart(2, '0')}-${String(local.getDate()).padStart(2, '0')}`;
                dayKeys.push(key);
            }

            // Map day keys to prices (null if no data for that day)
            const prices = dayKeys.map(k => (k in dayMap ? dayMap[k] : null));
            
            // Linear interpolate between known points for missing days
            let lastIdx = null;
            for (let i = 0; i < prices.length; i++) {
                if (prices[i] != null) {
                    if (lastIdx != null && i - lastIdx > 1) {
                        const startVal = prices[lastIdx];
                        const endVal = prices[i];
                        const span = i - lastIdx;
                        for (let j = lastIdx + 1; j < i; j++) {
                            const t = (j - lastIdx) / span;
                            prices[j] = startVal + (endVal - startVal) * t;
                        }
                    }
                    lastIdx = i;
                }
            }

            // Carry forward last known value to fill trailing gaps
            if (lastIdx != null) {
                for (let j = lastIdx + 1; j < prices.length; j++) {
                    prices[j] = prices[lastIdx];
                }
            }

            if (prices.every(p => p === null)) {
                document.getElementById('price-chart').insertAdjacentHTML('beforebegin', 
                    '<p class="text-muted">No valid price data available.</p>');
                return;
            }

            const labels = daysArr.map(d => d.toLocaleDateString());
            
            // Determine currency suffix for labels
            const currencySuffix = (currencyMode === 'base') ? ` ${CURRENT_BASE_CURRENCY}` : '';

            const ctx = document.getElementById('price-chart').getContext('2d');
            
            if (chart) chart.destroy();
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `Price${currencySuffix}`,
                        data: prices,
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: 'rgba(75, 192, 192, 0.1)',
                        tension: 0.15,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false,
                            labels: { font: fontSizeForDevice() }
                        },
                        tooltip: {
                            bodyFont: fontSizeForDevice(),
                            callbacks: {
                                label: context => {
                                    const v = context.parsed.y;
                                    return `Price: $${v.toFixed(2)}${currencySuffix}`;
                                }
                            }
                        }
                    },
                    interaction: { mode: 'nearest', intersect: false },
                    scales: {
                        x: {
                            ticks: {
                                font: fontSizeForDevice(),
                                maxTicksLimit: isMobile() ? 4 : 10
                            }
                        },
                        y: {
                            beginAtZero: false,
                            ticks: {
                                font: fontSizeForDevice(),
                                maxTicksLimit: isMobile() ? 4 : 10,
                                callback: function(value) {
                                    return '$' + value.toFixed(2);
                                }
                            }
                        }
                    }
                }
            });

            function isMobile() {
                return window.innerWidth <= 576;
            }
            function fontSizeForDevice() {
                return { size: isMobile() ? 12 : 14 };
            }
        });
}

function loadData() {
    const rawUrl = getUrlParameter('url');
    if (!rawUrl) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error-message').textContent = 'No product URL specified';
        document.getElementById('error-alert').style.display = 'block';
        return;
    }

    resolveProductUrl(rawUrl)
        .then(resolved => {
            RESOLVED_URL = resolved;
            // If resolved differs from raw, update the address bar to canonicalize
            try {
                if (resolved && resolved !== rawUrl) {
                    const u = new URL(window.location.href);
                    u.searchParams.set('url', resolved);
                    window.history.replaceState({}, '', u.toString());
                }
            } catch {}
            return Promise.all([
                loadProductInfo(resolved),
                loadStats(resolved),
                loadHistory(resolved)
            ]);
        })
        .then(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('product-detail').style.display = 'block';
        })
        .catch(error => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-message').textContent = error.message;
            document.getElementById('error-alert').style.display = 'block';
        });
}

// Initial load
loadData();

// Auto-refresh every 60 seconds
refreshInterval = setInterval(loadData, 60000);

// Currency toggle handler
document.addEventListener('DOMContentLoaded', () => {
    const toggle = document.getElementById('currency-toggle');
    if (toggle) {
        toggle.addEventListener('change', () => {
            const url = RESOLVED_URL || getUrlParameter('url');
            if (url) {
                loadHistory(url);
            }
        });
    }
    
    // Update price button handler
    const updateBtn = document.getElementById('update-price-btn');
    if (updateBtn) {
        updateBtn.addEventListener('click', () => {
            const url = RESOLVED_URL || getUrlParameter('url');
            if (!url) return;
            
            const originalHtml = updateBtn.innerHTML;
            updateBtn.disabled = true;
            updateBtn.innerHTML = '⏳ Updating...';
            
            fetch('/api/product/check', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url: url})
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.error || 'Request failed'); });
                }
                return response.json();
            })
            .then(result => {
                if (result.error) {
                    alert('Error: ' + result.error);
                } else {
                    // Reload all data to show updated price
                    loadData();
                }
            })
            .catch(error => {
                alert('Error: ' + error.message);
            })
            .finally(() => {
                updateBtn.disabled = false;
                updateBtn.innerHTML = originalHtml;
            });
        });
    }
});

// Cleanup
window.addEventListener('beforeunload', () => {
    if (refreshInterval) clearInterval(refreshInterval);
    if (chart) chart.destroy();
});
</script>
{% endblock %}
