<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}Sale Monitor Dashboard{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link rel="icon" type="image/png" sizes="256x256" href="{{ url_for('static', filename='img/icon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;
            -webkit-tap-highlight-color: transparent;
        }
        /* Safe area padding for notched devices */
        @supports (padding: env(safe-area-inset-bottom)) {
            body { padding-bottom: env(safe-area-inset-bottom); }
        }
        /* Smooth momentum scrolling on iOS */
        .overflow-x-auto, .overflow-y-auto {
            -webkit-overflow-scrolling: touch;
        }
        /* Ensure minimum tap target size on mobile */
        @media (max-width: 640px) {
            button, a.inline-flex, select, input[type="text"] {
                min-height: 44px;
            }
            select { font-size: 16px; } /* Prevents iOS zoom on focus */
        }
        /* Page fade-in transition */
        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .page-content {
            animation: pageFadeIn 0.25s ease-out;
        }
        /* Toast notifications */
        .sm-toast-stack {
            position: fixed; bottom: 1.5rem; right: 1.5rem;
            display: flex; flex-direction: column-reverse; gap: 0.5rem;
            z-index: 9999; pointer-events: none;
        }
        @media (max-width: 640px) {
            .sm-toast-stack {
                bottom: 0; right: 0; left: 0;
                padding: 0.75rem;
                align-items: stretch;
            }
        }
        .sm-toast {
            pointer-events: auto;
            min-width: 280px; max-width: 400px;
            padding: 0.75rem 1rem; border-radius: 0.5rem;
            color: #fff; font-size: 0.875rem; line-height: 1.25rem;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
            display: flex; align-items: start; gap: 0.5rem;
            animation: toastIn 0.3s ease-out;
        }
        @media (max-width: 640px) {
            .sm-toast {
                min-width: unset; max-width: none; width: 100%;
            }
        }
        .sm-toast.removing { animation: toastOut 0.25s ease-in forwards; }
        .sm-toast-success { background-color: #065f46; border: 1px solid #059669; }
        .sm-toast-error   { background-color: #7f1d1d; border: 1px solid #dc2626; }
        .sm-toast-info    { background-color: #1e3a5f; border: 1px solid #3b82f6; }
        .sm-toast-warning { background-color: #78350f; border: 1px solid #f59e0b; }
        .sm-toast .toast-close {
            margin-left: auto; cursor: pointer; opacity: 0.7;
            background: none; border: none; color: inherit; font-size: 1.1rem; line-height: 1;
        }
        .sm-toast .toast-close:hover { opacity: 1; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(20px); } }
        /* Skeleton loading */
        @keyframes shimmer {
            0% { background-position: -400px 0; }
            100% { background-position: 400px 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #1f2937 25%, #374151 50%, #1f2937 75%);
            background-size: 800px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 0.375rem;
        }
        .skeleton-text { height: 0.875rem; margin-bottom: 0.5rem; }
        .skeleton-text-sm { height: 0.75rem; margin-bottom: 0.375rem; }
        .skeleton-heading { height: 1.25rem; width: 60%; margin-bottom: 0.75rem; }
        .skeleton-card {
            background: #1f2937; border-radius: 0.5rem; padding: 1rem;
            border: 1px solid #374151;
        }
        /* Chart loading overlay */
        .chart-loader {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(17, 24, 39, 0.7);
            z-index: 5; border-radius: 0.375rem;
            transition: opacity 0.25s ease;
        }
        .chart-loader.hidden { opacity: 0; pointer-events: none; }
        .chart-loader-spinner {
            width: 2rem; height: 2rem;
            border: 3px solid #374151; border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* Confirm modal */
        .sm-confirm-overlay {
            position: fixed; inset: 0; z-index: 10000;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);
            display: flex; align-items: center; justify-content: center;
            animation: pageFadeIn 0.15s ease-out;
        }
        .sm-confirm-box {
            background: #1f2937; border: 1px solid #374151; border-radius: 0.75rem;
            padding: 1.5rem; max-width: 400px; width: 90%;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
        }
        .sm-confirm-title { color: #f3f4f6; font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
        .sm-confirm-msg { color: #9ca3af; font-size: 0.875rem; line-height: 1.4; margin-bottom: 1.25rem; }
        .sm-confirm-actions { display: flex; justify-content: flex-end; gap: 0.5rem; }
        .sm-confirm-actions button {
            padding: 0.5rem 1rem; border-radius: 0.375rem; font-size: 0.875rem; font-weight: 500;
            cursor: pointer; border: none; transition: background 0.15s;
        }
        .sm-confirm-cancel { background: #374151; color: #d1d5db; }
        .sm-confirm-cancel:hover { background: #4b5563; }
        .sm-confirm-ok { background: #dc2626; color: #fff; }
        .sm-confirm-ok:hover { background: #ef4444; }
        .sm-confirm-ok.primary { background: #0ea5e9; }
        .sm-confirm-ok.primary:hover { background: #38bdf8; }
    </style>
    {% block extra_head %}{% endblock %}
</head>

                        Alerts

    </div>
    
    <!-- Shared toast container -->
    <div id="sm-toast-stack" class="sm-toast-stack"></div>
    
    <script>
        // Mobile menu toggle with slide animation
        const menuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        if (menuButton && mobileMenu) {
            let menuOpen = false;
            menuButton.addEventListener('click', () => {
                if (menuOpen) {
                    mobileMenu.style.maxHeight = '0';
                } else {
                    mobileMenu.style.maxHeight = mobileMenu.scrollHeight + 'px';
                }
                menuOpen = !menuOpen;
            });
        }
        
        // Alerts badge updater
        function updateAlertsBadge() {
            fetch('/api/alerts', {signal: AbortSignal.timeout(5000)})
                .then(r => r.ok ? r.json() : Promise.reject())
                .then(alerts => {
                    const count = Array.isArray(alerts) ? alerts.length : 0;
                    const badge = document.getElementById('alerts-badge');
                    const badgeMobile = document.getElementById('alerts-badge-mobile');
                    
                    if (count > 0) {
                        if (badge) {
                            badge.textContent = count;
                            badge.classList.remove('hidden');
                            badge.classList.add('inline-flex');
                        }
                        if (badgeMobile) {
                            badgeMobile.textContent = count;
                            badgeMobile.classList.remove('hidden');
                            badgeMobile.classList.add('inline-flex');
                        }
                    } else {
                        if (badge) {
                            badge.classList.add('hidden');
                            badge.classList.remove('inline-flex');
                        }
                        if (badgeMobile) {
                            badgeMobile.classList.add('hidden');
                            badgeMobile.classList.remove('inline-flex');
                        }
                    }
                    updateFaviconBadge(count);
                })
                .catch(() => {
                    // Silently fail - badge stays hidden
                });
        }
        
        // Update on page load
        updateAlertsBadge();
        
        // Auto-refresh every 5 minutes, pausing when tab hidden
        var _badgeInterval = setInterval(updateAlertsBadge, 300000);
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                clearInterval(_badgeInterval);
            } else {
                updateAlertsBadge();
                _badgeInterval = setInterval(updateAlertsBadge, 300000);
            }
        });
        
        // Shared utility functions
        var _escapeDiv = document.createElement('div');
        function escapeHtml(str) {
            _escapeDiv.textContent = str;
            return _escapeDiv.innerHTML;
        }
        
        function formatPrice(price) {
            if (price === null || price === undefined) return 'N/A';
            return `$${parseFloat(price).toFixed(2)}`;
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return 'Never';
            const date = new Date(dateStr);
            return date.toLocaleString();
        }
        
        // Relative time formatting
        function timeAgo(dateStr) {
            if (!dateStr) return 'Never';
            const now = Date.now();
            const then = new Date(dateStr).getTime();
            const diff = Math.max(0, now - then);
            const sec = Math.floor(diff / 1000);
            if (sec < 60) return 'just now';
            const min = Math.floor(sec / 60);
            if (min < 60) return `${min}m ago`;
            const hr = Math.floor(min / 60);
            if (hr < 24) return `${hr}h ago`;
            const days = Math.floor(hr / 24);
            if (days < 30) return `${days}d ago`;
            const months = Math.floor(days / 30);
            if (months < 12) return `${months}mo ago`;
            return `${Math.floor(months / 12)}y ago`;
        }
        
        // Toast notification system
        let _toastId = 0;
        function pushToast(message, type = 'info', duration = 5000) {
            const stack = document.getElementById('sm-toast-stack');
            if (!stack) return;
            const id = ++_toastId;
            const icons = {
                success: '&#10003;', error: '&#10007;', info: '&#8505;', warning: '&#9888;'
            };
            const el = document.createElement('div');
            el.className = `sm-toast sm-toast-${type}`;
            el.id = `sm-toast-${id}`;
            el.innerHTML = `<span>${icons[type] || ''}</span><span>${escapeHtml(message)}</span><button class="toast-close" onclick="dismissToast(${id})">&times;</button>`;
            stack.appendChild(el);
            if (duration > 0) {
                setTimeout(() => dismissToast(id), duration);
            }
            return id;
        }
        function dismissToast(id) {
            const el = document.getElementById(`sm-toast-${id}`);
            if (!el) return;
            el.classList.add('removing');
            setTimeout(() => el.remove(), 250);
        }
        function showError(msg) { return pushToast(msg, 'error', 8000); }
        function showSuccess(msg) { return pushToast(msg, 'success'); }
        
        // Promise-based confirm dialog (replaces browser confirm())
        function smConfirm(message, { title = 'Confirm', okText = 'Delete', okClass = '' } = {}) {
            return new Promise(resolve => {
                const overlay = document.createElement('div');
                overlay.className = 'sm-confirm-overlay';
                overlay.innerHTML = `
                    <div class="sm-confirm-box">
                        <div class="sm-confirm-title">${escapeHtml(title)}</div>
                        <div class="sm-confirm-msg">${escapeHtml(message)}</div>
                        <div class="sm-confirm-actions">
                            <button class="sm-confirm-cancel" data-action="cancel">Cancel</button>
                            <button class="sm-confirm-ok ${okClass}" data-action="ok">${escapeHtml(okText)}</button>
                        </div>
                    </div>`;
                function close(val) {
                    overlay.style.opacity = '0';
                    setTimeout(() => { overlay.remove(); resolve(val); }, 150);
                }
                overlay.querySelector('[data-action="cancel"]').onclick = () => close(false);
                overlay.querySelector('[data-action="ok"]').onclick = () => close(true);
                overlay.addEventListener('click', e => { if (e.target === overlay) close(false); });
                document.addEventListener('keydown', function esc(e) {
                    if (e.key === 'Escape') { document.removeEventListener('keydown', esc); close(false); }
                });
                document.body.appendChild(overlay);
            });
        }
        
        // Favicon badge for alert count
        const _originalFavicon = document.querySelector('link[rel="icon"][type="image/svg+xml"]')?.href;
        function updateFaviconBadge(count) {
            const link = document.querySelector('link[rel="icon"][type="image/svg+xml"]');
            if (!link) return;
            if (!count || count <= 0) {
                if (_originalFavicon) link.href = _originalFavicon;
                return;
            }
            const label = count > 99 ? '99+' : String(count);
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#0369a1"/></linearGradient></defs>
                <rect width="100" height="100" rx="20" fill="url(#bg)"/>
                <text x="50" y="58" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="50" fill="#fff">$</text>
                <circle cx="78" cy="22" r="22" fill="#dc2626"/>
                <text x="78" y="30" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="${label.length > 2 ? 16 : 22}" fill="#fff">${label}</text>
            </svg>`;
            link.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
        }
        
        function isMobile() {
            return window.innerWidth <= 576;
        }
        
        function fontSizeForDevice() {
            return { size: isMobile() ? 12 : 14 };
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
